# Entorno de DESARROLLO. Levanta todo con:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [interna]
    # Sin "ports": la base de datos no se expone fuera de la red de Docker.
    # Si necesitas entrar con DBeaver/pgAdmin en desarrollo, descomenta (solo local):
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # API_PORT en .env si el 8000 está ocupado
    volumes:
      - ./backend:/app
      - documentos:/data/documentos  # archivos de alumnos (cifrados)
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks: [interna]

  # Tareas programadas (cierre diario de asistencia, vencimiento de inscripciones). Sin puertos expuestos.
  # No recarga solo al cambiar código: tras editarlo, "docker compose restart worker".
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      api:
        condition: service_healthy  # la API aplica las migraciones antes de quedar sana
    volumes:
      - ./backend:/app
    command: python -m app.worker
    healthcheck:  # reemplaza el de la imagen (que consulta la API): el worker escribe un latido cada 15 s
      test: ["CMD", "python", "-c", "import sys,time; sys.exit(0 if time.time() - int(open('/tmp/worker_latido').read()) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [interna]

  # Interfaz Angular (desarrollo). Abre http://localhost:4300 — /api se reenvía a la API (proxy.conf.json),
  # así el navegador ve un solo origen y la cookie de sesión funciona sin CORS.
  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4300}:4200"  # 4300: en este PC el 4200 lo usa otro proyecto
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # dependencias en un volumen: mucho más rápido que en Windows
    # --poll: en Docker Desktop para Windows los cambios de archivos no llegan como eventos.
    command: sh -c "npm install --no-audit --no-fund && npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    networks: [interna]

volumes:
  pgdata:
  documentos:
  frontend_node_modules:

networks:
  interna:
