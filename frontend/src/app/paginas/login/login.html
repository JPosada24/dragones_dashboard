<main class="fondo">
  <form class="tarjeta" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
    <div class="marca">
      <img src="escudo.png" alt="Escudo Club Dragones" width="64" height="64" />
      <div>
        <h1>DRAGONES</h1>
        <p class="sub">Club deportivo · voleibol</p>
      </div>
    </div>

    @if (expirada) {
      <p class="aviso" role="status">Tu sesión terminó. Vuelve a ingresar.</p>
    }

    <label class="campo">
      <span class="etiqueta">Correo</span>
      <input type="email" formControlName="email" autocomplete="username" inputmode="email" required
        [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="error-campo">Escribe un correo válido.</span>
      }
    </label>

    <label class="campo">
      <span class="etiqueta">Contraseña</span>
      <input type="password" formControlName="password" autocomplete="current-password" required
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="error-campo">Escribe tu contraseña.</span>
      }
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="boton" [disabled]="enviando()">
      {{ enviando() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>
</main>
