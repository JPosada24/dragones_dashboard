name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dragones
          POSTGRES_PASSWORD: solo_para_ci  # base desechable del runner, no es un secreto
          POSTGRES_DB: dragones
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dragones"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://dragones:solo_para_ci@localhost:5432/dragones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Estilo y errores comunes (ruff)
        run: ruff check .
      - name: Dependencias de producción sin vulnerabilidades conocidas (pip-audit)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      - name: Pruebas con cobertura mínima
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: Frontend (auditoría, lint, compilación y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipos de la API al día con el contrato OpenAPI
        run: npm run api:tipos && git diff --exit-code -- src/app/core/api/esquema.ts
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: Buenas prácticas de Angular y TypeScript (ESLint)
        run: npm run lint
      - run: npx ng build
      - name: Pruebas con cobertura mínima (umbrales en angular.json)
        run: npx ng test --watch=false --coverage

  imagen:
    name: Imagen Docker de la API (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scripts de respaldo sin errores comunes (shellcheck)
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 deploy/respaldo/respaldar.sh deploy/respaldo/restaurar.sh
      - name: Configuración de producción válida
        run: >-
          cp .env.example .env && PANEL_DOMINIO=panel.ejemplo.com ACME_EMAIL=ci@ejemplo.com RESPALDO_AGE_PUBLICA=age1ci
          docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet
      - run: docker build -t dragones-api:ci backend
      - name: Sin vulnerabilidades altas o críticas con arreglo disponible
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.56.2
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress dragones-api:ci

  secretos:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # revisa todo el historial, no solo el último commit
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
