name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dragones
          POSTGRES_PASSWORD: solo_para_ci  # base desechable del runner, no es un secreto
          POSTGRES_DB: dragones
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dragones"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://dragones:solo_para_ci@localhost:5432/dragones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Estilo y errores comunes (ruff)
        run: ruff check .
      - run: pytest

  frontend:
    name: Frontend (auditoría, lint, compilación y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Dependencias de producción sin vulnerabilidades altas
        run: npm audit --omit=dev --audit-level=high
      - name: Buenas prácticas de Angular y TypeScript (ESLint)
        run: npm run lint
      - run: npx ng build
      - run: npx ng test --watch=false

  secretos:
    name: Búsqueda de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # revisa todo el historial, no solo el último commit
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
